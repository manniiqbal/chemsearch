services:
  backend:
    build: ./backend
    environment:
      FRONTEND_ORIGIN: http://localhost:3000
      HF_HOME: /models/huggingface
    ports:
      - "8000:8000"
    volumes:
      - reaction-models:/models/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 4s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  reaction-models:
